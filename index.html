<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .container {
            text-align: center;
            background: #ffffff;
            padding: 60px 80px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 40px;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .links a {
            display: block;
            padding: 16px 48px;
            font-size: 1.1rem;
            color: #4a90d9;
            text-decoration: none;
            border: 2px solid #4a90d9;
            border-radius: 10px;
            transition: all 0.25s ease;
            letter-spacing: 0.03em;
        }

        .links a:hover {
            background-color: #4a90d9;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 217, 0.3);
        }

        .links a:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Navigate</h1>
        <div class="links">
            <a href="Touhou_Kosuzus_Adventure/">Touhou Kosuzu's Adventure</a>
            <a href="mic-test/">Mic Test</a>
        </div>
    </div>
</body>
</html>
