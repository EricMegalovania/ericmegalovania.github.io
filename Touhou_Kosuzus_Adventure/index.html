<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @font-face {
            font-family: 'MapleMono-NF-CN';
            src: url('./font/MapleMono-NF-CN-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'MapleMono-NF-CN', monospace;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-instructions {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid #0f3460;
        }
    </style>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Touhou Kosuzu's Adventure</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
    <div class="game-instructions" style="position: absolute;left:0;top:0">
        <div>Q: Pause (and tutorial)</div>
        <div>R: Restart</div>
        <div>O: Previous Level</div>
        <div>P: Next Level</div>
        <div>Have fun!</div>
        <div>为了最佳的游戏体验</div>
        <div>请佩戴耳机</div>
        <div>并一定要关闭浏览器手势</div>
        <div>P.S. W也可以跳跃</div>
        <!-- By DeepSeek, 👇 新增下载区 -->
        <div style="margin-top:12px; border-top:1px solid #0f3460; padding-top:10px;">
            <a href="./EXE.zip" download
               style="display:block; margin:5px 0; padding:6px 10px; background:#0f3460; color:#fff;
                      text-decoration:none; border-radius:5px; text-align:center; font-weight:bold;">
                ⬇ 下载 EXE 版本
            </a>
            <a href="./Gameproposal.pdf" target="_blank"
               style="display:block; margin:5px 0; padding:6px 10px; background:#e94560; color:#fff;
                      text-decoration:none; border-radius:5px; text-align:center; font-weight:bold;">
                📄 查看游戏提案 (PDF)
            </a>
        </div>
    </div>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=1000 height=600 tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">Touhou Kosuzu's Adventure</div>
        </div>
    </div>
    <script>

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");

        // Shows a temporary message banner/ribbon for a few seconds, or
        // a permanent error message on top of the canvas if type=='error'.
        // If type=='warning', a yellow highlight color is used.
        // Modify or remove this function to customize the visually presented
        // way that non-critical warnings and error messages are presented to the
        // user.
        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/WebGL.loader.js";
        var config = {
            dataUrl: buildUrl + "/WebGL.data",
            frameworkUrl: buildUrl + "/WebGL.framework.js",
            codeUrl: buildUrl + "/WebGL.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Touhou Kosuzu's Adventure",
            productVersion: "1.0",
            showBanner: unityShowBanner,
        };

        // By default, Unity keeps WebGL canvas render target size matched with
        // the DOM size of the canvas element (scaled by window.devicePixelRatio)
        // Set this to false if you want to decouple this synchronization from
        // happening inside the engine, and you would instead like to size up
        // the canvas DOM size and WebGL render target sizes yourself.
        // config.matchWebGLToCanvasSize = false;

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            // Mobile device style: fill the whole browser client area with the game canvas:

            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";

            // To lower canvas resolution on mobile devices to gain some
            // performance, uncomment the following line:
            // config.devicePixelRatio = 1;


        } else {
            // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

            canvas.style.width = "1000px";
            canvas.style.height = "600px";
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                    unityInstance.SetFullscreen(1);
                };
            }).catch((message) => {
                alert(message);
            });
        };

        document.body.appendChild(script);

    </script>
</body>
</html>

<script>
function addFontLicense() {
    const licenseLink = document.createElement('a');
    licenseLink.href = 'https://github.com/subframe7536/maple-font/tree/variable?tab=OFL-1.1-1-ov-file#readme';
    licenseLink.className = 'font-license';
    licenseLink.target = '_blank';
    licenseLink.rel = 'noopener noreferrer';
    licenseLink.title = '查看字体许可证详情';
    licenseLink.textContent = '字体：Maple Font (OFL-1.1)';
    const style = document.createElement('style');
    style.textContent = `
        .font-license {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
            color: #666;
            background: rgba(255, 255, 255, 0.9);
            padding: 5px 8px;
            border-radius: 3px;
            z-index: 1000;
            text-decoration: none;
            border: 1px solid #eee;
            font-family: Arial, sans-serif;
            transition: all 0.3s ease;
        }
        
        .font-license:hover {
            color: #333;
            background: rgba(255, 255, 255, 0.95);
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .font-license {
                font-size: 10px;
                padding: 3px 6px;
                bottom: 5px;
                right: 5px;
            }
        }
    `;
    document.head.appendChild(style);
    document.body.appendChild(licenseLink);
}
document.addEventListener('DOMContentLoaded', addFontLicense);
</script>
